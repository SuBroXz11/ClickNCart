<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Company Name</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Define your custom font */
        @font-face {
            font-family: 'Mosvita';
            src: url('./font/mosvita.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; /* Optional: improves performance */
        }

        :root {
            --primary-color: #2d3748;
            --secondary-color: #4a5568;
            --accent-color: #3182ce;
            --text-color: #1a202c;
            --light-color: #f7fafc;
            --border-color: #e2e8f0;
            --transition-speed: 0.2s;
        }
        
        body {
            font-family: 'Mosvita', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: var(--text-color);
        }
        
        /* Simple animation for form elements */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated {
            animation: fadeIn 0.4s ease forwards;
        }
        
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        
        /* Input with icon styling */
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-color);
        }
        
        .input-with-icon input {
            padding-left: 40px !important;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Rest of your HTML remains the same -->
    <div class="login-container h-screen">
        <div class="flex flex-col md:flex-row h-full">
            <!-- Left Side - Image -->
            <div class="hidden md:block md:w-1/2 bg-gray-100 h-screen overflow-hidden relative">
                <img src="https://cdn.pixabay.com/photo/2018/02/06/22/43/painting-3135875_1280.jpg" alt="Login" class="w-full h-full object-cover absolute top-0 left-0">
            </div>
            
            <!-- Right Side - Login Form -->
            <div class="w-full md:w-1/2 flex flex-col justify-center px-8 md:px-16 lg:px-32 py-12 h-screen">
                <h2 class="text-3xl font-bold mb-2 animated">Welcome back</h2>
                <p class="text-gray-600 mb-8 animated delay-1">Please enter your credentials to login</p>
                
                <form id="loginForm" class="w-full">
                    <!-- Email Input -->
                    <div class="mb-6 animated delay-1">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <div class="input-with-icon relative">
                            <i class="fas fa-envelope"></i>
                            <input id="email" type="email" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" name="email" placeholder="Your email address" required autofocus>
                        </div>
                        <div id="emailError" class="text-red-600 text-sm mt-2 hidden">Please enter a valid email address</div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-6 animated delay-2">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="input-with-icon relative">
                            <i class="fas fa-lock"></i>
                            <input id="password" type="password" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" name="password" placeholder="Your password" required>
                        </div>
                        <div id="passwordError" class="text-red-600 text-sm mt-2 hidden">Password is required</div>
                    </div>

                    <!-- Login Button -->
                    <div class="animated delay-3">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-md transition duration-200 transform hover:-translate-y-1 active:translate-y-0" id="loginBtn">
                            Log In
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Your JavaScript remains the same
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Reset error messages
            document.querySelectorAll('[id$="Error"]').forEach(el => {
                el.classList.add('hidden');
            });
            
            // Button loading state
            const loginBtn = document.getElementById('loginBtn');
            const btnText = loginBtn.innerText;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...';
            loginBtn.disabled = true;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simple validation
            let hasError = false;
            if (!email || !email.includes('@')) {
                document.getElementById('emailError').classList.remove('hidden');
                hasError = true;
            }
            
            if (!password) {
                document.getElementById('passwordError').classList.remove('hidden');
                hasError = true;
            }
            
            if (hasError) {
                loginBtn.innerHTML = btnText;
                loginBtn.disabled = false;
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success - store token
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to dashboard
                    loginBtn.innerHTML = '<i class="fas fa-check mr-2"></i> Success!';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    // Reset button
                    loginBtn.innerHTML = btnText;
                    loginBtn.disabled = false;
                    
                    // Show error
                    alert(data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Error:', error);
                
                // Reset button
                loginBtn.innerHTML = btnText;
                loginBtn.disabled = false;
                
                // Show error
                alert('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>

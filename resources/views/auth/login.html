<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Company Name</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome (icons) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-p6O1okpC2hR8sVx0jlz+bbvQALDHk1B5ArfZKGbzj3Y9UpYpZW63hBCaMqPZxp+4LFZkxXUxUYQYFZ+Ek5Q1Zg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- SweetAlert2 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />

<style>
    @font-face {
      font-family: 'Mosvita';
      src: url('./font/mosvita.otf') format('opentype');
      font-display: swap;
    }
    :root {
      --primary-color: #2d3748;
      --secondary-color: #4a5568;
      --accent-color: #3182ce;
      --text-color: #1a202c;
    }
    body {
      font-family: 'Mosvita','Segoe UI',sans-serif;
      background-color: #f8f9fa;
      height: 100vh;
      margin: 0; overflow: hidden;
      color: var(--text-color);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animated { animation: fadeIn 0.4s ease forwards; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }

    .input-with-icon { position: relative; }
    .input-with-icon i {
      position: absolute; left: 15px; top: 50%;
      transform: translateY(-50%);
      color: var(--secondary-color);
    }
    .input-with-icon input { padding-left: 40px !important; }

    .signup-link {
      color: var(--accent-color);
      text-decoration: none; font-weight: 500;
      transition: color .2s;
    }
    .signup-link:hover {
      color: #2c5282; text-decoration: underline;
    }
</style>
</head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <!-- Left image panel for md+ -->
    <div class="hidden md:block md:w-1/2 bg-gray-100 relative">
        <img src="https://cdn.pixabay.com/photo/2018/02/06/22/43/painting-3135875_1280.jpg" alt="Login"
            class="absolute inset-0 w-full h-full object-cover" />
    </div>

    <!-- Right form panel -->
    <div class="w-full md:w-1/2 flex flex-col justify-center px-8 md:px-16 lg:px-32 py-12">
        <h2 class="text-3xl font-bold mb-2 animated">Welcome back</h2>
    <p class="text-gray-600 mb-8 animated delay-1">
        Please enter your credentials to login
    </p>

    <form id="loginForm" class="space-y-6">
        <!-- Email -->
        <div class="animated delay-1">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <div class="input-with-icon">
            <i class="fas fa-envelope"></i>
            <input id="email" type="email" name="email" placeholder="Your email" required autofocus
                class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-transparent transition" />
            </div>
        <p id="emailError" class="text-red-600 text-sm mt-1 hidden">
            Please enter a valid email
        </p>
        </div>

        <!-- Password -->
        <div class="animated delay-2">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                Password
            </label>
            <div class="input-with-icon">
                <i class="fas fa-lock"></i>
            <input id="password" type="password" name="password" placeholder="Your password" required
                class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-transparent transition" />
            </div>
        <p id="passwordError" class="text-red-600 text-sm mt-1 hidden">
            Password is required
        </p>
        </div>

        <!-- Submit -->
        <div class="animated delay-3">
            <button type="submit" id="loginBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-md transition transform hover:-translate-y-1">
                Log In
            </button>
        </div>

        <!-- Signup link -->
        <div class="text-center animated delay-3">
            <p class="text-gray-600">
                Don't have an account?
                <a href="/register" class="signup-link">Sign up</a>
            </p>
        </div>
        </form>
        </div>
        </div>
<!-- SweetAlert2 JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

        // Hide previous errors
        document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));

        const loginBtn = document.getElementById('loginBtn');
        const originalText = loginBtn.innerHTML;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...';
        loginBtn.disabled = true;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        // Simple client-side validation
        let bad = false;
        if (!email || !email.includes('@')) {
            document.getElementById('emailError').classList.remove('hidden');
            bad = true;
        }
        if (!password) {
            document.getElementById('passwordError').classList.remove('hidden');
            bad = true;
        }
        if (bad) {
            loginBtn.innerHTML = originalText;
            loginBtn.disabled = false;
            return;
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({ email, password })
          });
            const data = await res.json();

            if (!res.ok) {
                // Show error popup
                return Swal.fire({
                    icon: 'error',
                    title: 'Login failed',
                    text: data.message || 'Please check your credentials',
                }).then(() => {
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                });
            }

            // Success: store and popup
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));

            await Swal.fire({
                icon: 'success',
                title: 'Logged in!',
                showConfirmButton: false,
                timer: 1200
            });

            // Redirect based on role
            const dest = data.user.role === 'user' ? '/' : '/dashboard';
            window.location.href = dest;

        } catch (err) {
            console.error(err);
            await Swal.fire({
                icon: 'error',
                title: 'Oops...',
                text: 'Something went wrong. Try again later.',
            });
            loginBtn.innerHTML = originalText;
            loginBtn.disabled = false;
        }
    });
      </script>
</body>
</html>

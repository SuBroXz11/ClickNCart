<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Approval</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preload" href="./font/mosvita.otf" as="font" type="font/otf" crossorigin>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

         @font-face {
            font-family: 'Mosvita';
            src: url('./font/mosvita.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; /* Optional: improves performance */
        }

        body {
            font-family: 'Mosvita', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: var(--text-color);
        }
        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .user-avatar {
            border: 3px solid #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                <i class="fas fa-user-shield mr-2 text-blue-500"></i>User Approval Dashboard
            </h1>
            <p class="text-gray-600 mt-2">Review and approve pending retailer accounts</p>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="px-6 py-4 bg-blue-600 text-white flex justify-between items-center">
                <h2 class="text-xl font-semibold">
                    <i class="fas fa-users mr-2"></i>Pending Approvals
                </h2>
                <div class="flex items-center">
                    <span id="pendingCount" class="bg-yellow-400 text-gray-800 px-3 py-1 rounded-full text-sm font-medium">0</span>
                    <button id="refreshBtn" class="ml-3 bg-white text-blue-600 p-2 rounded-full hover:bg-blue-50 transition">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
            <div class="p-6">
                <div id="loadingSpinner" class="text-center hidden">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mb-2"></div>
                    <p class="text-gray-600">Loading users...</p>
                </div>
                <div id="usersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Users will be loaded here -->
                </div>
                <div id="emptyState" class="text-center py-12 hidden">
                    <i class="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
                    <h3 class="text-xl font-medium text-gray-800">No pending approvals</h3>
                    <p class="text-gray-500 mt-1">All users have been approved</p>
                </div>
            </div>
        </div>
    </div>

    <!-- User Detail Modal -->
    <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b p-4">
                <h3 class="text-xl font-semibold text-gray-800">User Details</h3>
                <button id="closeModal" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6" id="userDetails">
                <!-- User details will be loaded here -->
            </div>
            <div class="border-t p-4 flex justify-end">
                <button id="approveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
                    Approve User
                </button>
            </div>
        </div>
    </div>

    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script>
        // Global variables
        let currentUserId = null;
        let allUsers = []; // Store all fetched users
        const apiBaseUrl = 'http://localhost:8000/api'; // Replace with your API base URL
        
        // DOM elements
        const usersContainer = document.getElementById('usersContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const emptyState = document.getElementById('emptyState');
        const pendingCount = document.getElementById('pendingCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const userModal = document.getElementById('userModal');
        const closeModal = document.getElementById('closeModal');
        const approveBtn = document.getElementById('approveBtn');
        const userDetails = document.getElementById('userDetails');

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            fetchUnapprovedUsers();
            
            // Set up event listeners
            refreshBtn.addEventListener('click', fetchUnapprovedUsers);
            closeModal.addEventListener('click', () => userModal.classList.add('hidden'));
            approveBtn.addEventListener('click', approveUser);
        });

        // Fetch unapproved users from API
        async function fetchUnapprovedUsers() {
            showLoading(true);
            
            try {
                const response = await axios.get(`${apiBaseUrl}/unapproved-retailers`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}` // Assuming token is stored
                    }
                });
                
                allUsers = response.data; // Store all users
                displayUsers(allUsers);
            } catch (error) {
                console.error('Error fetching users:', error);
                alert('Failed to fetch users. Please try again.');
                showLoading(false);
            }
        }

        // Display users in the UI
        function displayUsers(users) {
            usersContainer.innerHTML = '';
            pendingCount.textContent = users.length;
            
            if (users.length === 0) {
                emptyState.classList.remove('hidden');
                usersContainer.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                usersContainer.classList.remove('hidden');
                
                users.forEach(user => {
                    const userCard = document.createElement('div');
                    userCard.className = 'user-card bg-white rounded-lg shadow p-4 transition cursor-pointer hover:shadow-md';
                    userCard.setAttribute('data-user', JSON.stringify(user));
                    userCard.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <img src="${user.profile_picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=3b82f6&color=fff'}" 
                                 alt="${user.name}" 
                                 class="user-avatar w-16 h-16 rounded-full object-cover">
                            <div>
                                <h3 class="font-medium text-gray-900">${user.name}</h3>
                                <p class="text-gray-600 text-sm">${user.email}</p>
                                <span class="inline-block mt-1 bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded-full">
                                    Pending Approval
                                </span>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-end">
                            <button class="view-details-btn bg-blue-50 text-blue-600 px-3 py-1 rounded text-sm font-medium hover:bg-blue-100 transition">
                                View Details
                            </button>
                        </div>
                    `;
                    
                    usersContainer.appendChild(userCard);
                });
                
                // Add click event to all view buttons and cards
                document.querySelectorAll('.user-card, .view-details-btn').forEach(element => {
                    element.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const userCard = e.target.closest('.user-card');
                        const userData = JSON.parse(userCard.getAttribute('data-user'));
                        showUserDetails(userData);
                    });
                });
            }
            
            showLoading(false);
        }

        // Show loading state
        function showLoading(show) {
            if (show) {
                loadingSpinner.classList.remove('hidden');
                usersContainer.classList.add('hidden');
                emptyState.classList.add('hidden');
            } else {
                loadingSpinner.classList.add('hidden');
            }
        }

        // Show user details in modal using the already fetched data
        function showUserDetails(user) {
            currentUserId = user.id;
            
            userDetails.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex-shrink-0">
                        <img src="${user.profile_picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=3b82f6&color=fff'}" 
                             alt="${user.name}" 
                             class="user-avatar w-24 h-24 rounded-full object-cover mx-auto md:mx-0">
                        ${user.business_registration_image ? `
                        <div class="mt-4">
                            <p class="text-sm text-gray-500 mb-1">Business Registration</p>
                            <a href="${apiBaseUrl}/${user.business_registration_image}" target="_blank" class="text-blue-600 hover:underline">
                                View Document
                            </a>
                        </div>
                        ` : ''}
                    </div>
                    <div class="flex-grow">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <p class="text-sm text-gray-500">Full Name</p>
                                <p class="font-medium">${user.name}</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">Email</p>
                                <p class="font-medium">${user.email}</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">Phone</p>
                                <p class="font-medium">${user.phone_number || 'Not provided'}</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">Status</p>
                                <p class="font-medium">
                                    <span class="inline-block bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-xs">
                                        ${user.status}
                                    </span>
                                </p>
                            </div>
                            <div class="md:col-span-2">
                                <p class="text-sm text-gray-500">Address</p>
                                <p class="font-medium">${user.address || 'Not provided'}</p>
                            </div>
                            <div class="md:col-span-2">
                                <p class="text-sm text-gray-500">Registered On</p>
                                <p class="font-medium">${new Date(user.created_at).toLocaleDateString()}</p>
                            </div>
                            <div class="md:col-span-2 border-t pt-4 mt-2">
                                <h4 class="font-medium text-gray-800 mb-2">Business Information</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <p class="text-sm text-gray-500">Business Name</p>
                                        <p class="font-medium">${user.business_name || 'Not provided'}</p>
                                    </div>
                                    <div>
                                        <p class="text-sm text-gray-500">Tax ID</p>
                                        <p class="font-medium">${user.tax_id || 'Not provided'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            userModal.classList.remove('hidden');
        }

        // Approve user function
        async function approveUser() {
            if (!currentUserId) return;
            
            try {
                approveBtn.disabled = true;
                approveBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Approving...';
                
                await axios.post(`${apiBaseUrl}/retailers/${currentUserId}/approve`, {}, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
                    }
                });
                
                // Close modal and refresh list
                userModal.classList.add('hidden');
                fetchUnapprovedUsers();
                
                // Show success message
                const successMsg = document.createElement('div');
                successMsg.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg flex items-center';
                successMsg.innerHTML = `
                    <i class="fas fa-check-circle mr-2"></i>
                    <span>User approved successfully!</span>
                `;
                document.body.appendChild(successMsg);
                
                setTimeout(() => {
                    successMsg.remove();
                }, 3000);
                
            } catch (error) {
                console.error('Error approving user:', error);
                alert('Failed to approve user. Please try again.');
            } finally {
                approveBtn.disabled = false;
                approveBtn.textContent = 'Approve User';
            }
        }
    </script>
</body>
</html>

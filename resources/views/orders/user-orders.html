<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ClickNCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/mosvita@1.0.0/dist/mosvita.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mosvita@1.0.0/dist/mosvita.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Mosvita';
            src: url('./font/mosvita.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body {
            font-family: 'Mosvita', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .star-rating {
            display: inline-flex;
            flex-direction: row-reverse;
        }
        .star-rating input {
            display: none;
        }
        .star-rating label {
            cursor: pointer;
            font-size: 1.5rem;
            color: #ddd;
            padding: 0 0.1em;
        }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #ffd700;
        }
        /* Add input styling */
        .input-field {
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            border-radius: 0.375rem;
            width: 100%;
            transition: border-color 0.15s ease-in-out;
            margin-bottom: 1rem;
        }
        .input-field:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
   

    <div class="min-h-screen ">
       
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <h1 class="text-2xl font-semibold text-gray-900">My Orders</h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Orders List -->
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Products</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersList" class="bg-white divide-y divide-gray-200">
                            <!-- Orders will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="mt-4 flex justify-between items-center">
                <div class="text-sm text-gray-700">
                    Showing <span id="currentPage">1</span> of <span id="totalPages">1</span> pages
                </div>
                <div class="flex gap-2">
                    <button id="prevPage" class="px-4 py-2 border rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                        Previous
                    </button>
                    <button id="nextPage" class="px-4 py-2 border rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                        Next
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="fixed inset-0 bg-gray-500 bg-opacity-75 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b">
                    <h3 class="text-lg font-medium text-gray-900">Write a Review</h3>
                </div>
                <div class="px-6 py-4">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Rating</label>
                        <div class="star-rating">
                            <input type="radio" id="star5" name="rating" value="5" />
                            <label for="star5">★</label>
                            <input type="radio" id="star4" name="rating" value="4" />
                            <label for="star4">★</label>
                            <input type="radio" id="star3" name="rating" value="3" />
                            <label for="star3">★</label>
                            <input type="radio" id="star2" name="rating" value="2" />
                            <label for="star2">★</label>
                            <input type="radio" id="star1" name="rating" value="1" />
                            <label for="star1">★</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="reviewComment" class="block text-sm font-medium text-gray-700 mb-2">Comment</label>
                        <textarea id="reviewComment" rows="4" class="input-field"></textarea>
                    </div>
                </div>
                <div class="px-6 py-4 border-t flex justify-end gap-3">
                    <button id="cancelReview" class="px-4 py-2 border rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                        Cancel
                    </button>
                    <button id="submitReview" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                        Submit Review
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cancel Modal -->
    <div id="cancelModal" class="fixed inset-0 bg-gray-500 bg-opacity-75 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b">
                    <h3 class="text-lg font-medium text-gray-900">Cancel Order</h3>
                </div>
                <div class="px-6 py-4">
                    <div class="mb-4">
                        <label for="cancelReason" class="block text-sm font-medium text-gray-700 mb-2">Reason for Cancellation</label>
                        <textarea id="cancelReason" rows="4" class="input-field" required></textarea>
                    </div>
                </div>
                <div class="px-6 py-4 border-t flex justify-end gap-3">
                    <button id="cancelRequestBtn" class="px-4 py-2 border rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                        Cancel
                    </button>
                    <button id="submitCancelBtn" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700">
                        Submit Cancellation
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentProductId = null;
        let currentOrderItemId = null;
        const token = localStorage.getItem('auth_token');

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                showNotification('Please login to access this page', 'error');
                window.location.href = '/login.html';
                return;
            }
            loadOrders();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Pagination listeners
            document.getElementById('prevPage').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadOrders();
                }
            });
            document.getElementById('nextPage').addEventListener('click', () => {
                currentPage++;
                loadOrders();
            });

            // Review modal listeners
            document.getElementById('cancelReview').addEventListener('click', () => {
                document.getElementById('reviewModal').classList.add('hidden');
            });
            document.getElementById('submitReview').addEventListener('click', submitReview);

            // Cancel modal listeners
            document.getElementById('cancelRequestBtn').addEventListener('click', () => {
                document.getElementById('cancelModal').classList.add('hidden');
            });
            document.getElementById('submitCancelBtn').addEventListener('click', submitCancellation);
        }

        async function loadOrders() {
            try {
                const response = await fetch(`/api/orders?page=${currentPage}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (response.status === 401) {
                    showNotification('Session expired. Please login again', 'error');
                    window.location.href = '/login.html';
                    return;
                }

                if (!response.ok) throw new Error('Failed to fetch orders');

                const responseData = await response.json();
                if (responseData.success) {
                    renderOrders(responseData.data.data);
                    updatePagination(responseData.data);
                } else {
                    throw new Error('Failed to fetch orders');
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                showNotification('Error loading orders', 'error');
            }
        }

        function renderOrders(orders) {
            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = '';

            orders.forEach(order => {
                order.items.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${order.order_id}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">
                            <div class="flex items-center">
                                <div class="flex-shrink-0 h-10 w-10">
                                    <img class="h-10 w-10 rounded object-cover" src="${item.product.images[0] || 'https://via.placeholder.com/40'}" alt="">
                                </div>
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-gray-900">${item.product_name}</div>
                                    <div class="text-sm text-gray-500">
                                        Quantity: ${item.quantity}
                                        ${item.product.variants ? `<br>Variant: ${item.product.variants[0]?.color || 'N/A'}` : ''}
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            <div class="text-sm font-medium">$${item.total}</div>
                            <div class="text-xs text-gray-500">
                                Subtotal: $${order.subtotal}<br>
                                Tax: $${order.tax}<br>
                                Shipping: $${order.shipping}
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(item.status)}">
                                ${item.status}
                            </span>
                            ${item.cancel_requested ? `
                                <div class="mt-1 text-xs ${item.cancel_requested === 'pending' ? 'text-yellow-600' : 
                                    item.cancel_requested === 'approved' ? 'text-green-600' : 'text-red-600'}">
                                    Cancellation ${item.cancel_requested}
                                </div>
                            ` : ''}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${new Date(order.created_at).toLocaleDateString()}
                            <div class="text-xs text-gray-500">
                                ${new Date(order.created_at).toLocaleTimeString()}
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            ${getActionButtons(item)}
                        </td>
                    `;
                    ordersList.appendChild(row);
                });
            });
        }

        function getStatusColor(status) {
            const colors = {
                pending: 'bg-yellow-100 text-yellow-800',
                processing: 'bg-blue-100 text-blue-800',
                shipped: 'bg-purple-100 text-purple-800',
                delivered: 'bg-green-100 text-green-800',
                cancelled: 'bg-red-100 text-red-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        function getActionButtons(item) {
            let buttons = '';
            
            if (item.status === 'shipped') {
                buttons += `
                    <button onclick="openReviewModal('${item.product.product_id}')" 
                            class="text-indigo-600 hover:text-indigo-900 mr-2">
                        Write Review
                    </button>
                `;
            }
            
            if (item.status === 'processing') {
                buttons += `
                    <button onclick="openCancelModal('${item.order_item_id}')" 
                            class="text-red-600 hover:text-red-900">
                        Cancel Order
                    </button>
                `;
            }
            
            return buttons || 'No actions available';
        }

        function openReviewModal(productId) {
            currentProductId = productId;
            document.getElementById('reviewModal').classList.remove('hidden');
            // Reset form
            document.querySelectorAll('input[name="rating"]').forEach(input => input.checked = false);
            document.getElementById('reviewComment').value = '';
        }

        async function submitReview() {
            try {
                const rating = document.querySelector('input[name="rating"]:checked')?.value;
                const comment = document.getElementById('reviewComment').value;

                if (!rating) {
                    showNotification('Please select a rating', 'error');
                    return;
                }

                const response = await fetch(`/api/${currentProductId}/reviews`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        rating: parseInt(rating),
                        comment: comment
                    })
                });

                if (response.status === 401) {
                    showNotification('Session expired. Please login again', 'error');
                    window.location.href = '/login.html';
                    return;
                }

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to submit review');
                }

                document.getElementById('reviewModal').classList.add('hidden');
                showNotification('Review submitted successfully', 'success');
                loadOrders(); // Reload orders to reflect the change
            } catch (error) {
                console.error('Error submitting review:', error);
                showNotification(error.message || 'Error submitting review', 'error');
            }
        }

        function openCancelModal(orderItemId) {
            currentOrderItemId = orderItemId;
            document.getElementById('cancelModal').classList.remove('hidden');
            document.getElementById('cancelReason').value = '';
        }

        async function submitCancellation() {
            try {
                const reason = document.getElementById('cancelReason').value;
                
                if (!reason.trim()) {
                    showNotification('Please provide a reason for cancellation', 'error');
                    return;
                }

                const response = await fetch(`/api/orders/${currentOrderItemId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        reason: reason
                    })
                });

                if (response.status === 401) {
                    showNotification('Session expired. Please login again', 'error');
                    window.location.href = '/login.html';
                    return;
                }

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to cancel order');
                }

                document.getElementById('cancelModal').classList.add('hidden');
                showNotification('Cancellation request submitted successfully', 'success');
                
                // Update the order in the local array
                const orderIndex = orders.findIndex(o => o.order_item_id === currentOrderItemId);
                if (orderIndex !== -1) {
                    orders[orderIndex].cancel_requested = 'pending';
                    orders[orderIndex].cancel_reason = reason;
                    renderOrders(orders);
                }
            } catch (error) {
                console.error('Error submitting cancellation:', error);
                showNotification(error.message || 'Error submitting cancellation request', 'error');
            }
        }

        function updatePagination(meta) {
            document.getElementById('currentPage').textContent = meta.current_page;
            document.getElementById('totalPages').textContent = meta.last_page;
            
            const prevButton = document.getElementById('prevPage');
            const nextButton = document.getElementById('nextPage');
            
            prevButton.disabled = meta.current_page === 1;
            nextButton.disabled = meta.current_page === meta.last_page;
            
            prevButton.classList.toggle('opacity-50', meta.current_page === 1);
            nextButton.classList.toggle('opacity-50', meta.current_page === meta.last_page);
        }

        function showNotification(message, type = 'success') {
            const notification = new mosvita.Notification({
                message: message,
                type: type,
                duration: 3000
            });
            notification.show();
        }
    </script>
</body>
</html>

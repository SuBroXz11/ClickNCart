<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wishlist | ClickNCart</title>

  <!-- Tailwind CSS + DaisyUI plugin -->
  <script>
    // configure DaisyUI as a Tailwind plugin
    tailwind = window.tailwind || {};
    tailwind.config = {
      plugins: [daisyui],
      daisyui: {
        themes: ['light','garden'],
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preload" href="./font/mosvita.otf" as="font" type="font/otf" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/daisyui@2.51.5/dist/full.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
 @font-face {
            font-family: 'Mosvita';
            src: url('./font/mosvita.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
               font-family: 'Mosvita', 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }
    
    /* Header Styles */
    header {
      background-color: white;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
      position: fixed;
      width: 100%;
      z-index: 1000;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 5%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 64px;
      width: auto;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      list-style: none;
    }

    .nav-links li {
      margin-left: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: #2d3436;
      font-weight: 500;
      transition: color 0.3s;
      position: relative;
    }

    .nav-links a:hover {
      color: #6c5ce7;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      background: #6c5ce7;
      bottom: -5px;
      left: 0;
      transition: width 0.3s;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .auth-buttons .btn {
      margin-left: 1rem;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-outline {
      border: 2px solid #6c5ce7;
      padding: 10px 20px;
      color: #6c5ce7;
      text-decoration: none;
      border-radius: 40px;
    }

    .btn-outline:hover {
      background: #6c5ce7;
      color: white;
    }

    .btn-primary {
      background: #6c5ce7;
      color: white;
      border: 2px solid #6c5ce7;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 40px;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      background: #5649c0;
      border-color: #5649c0;
    }
  </style>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Header -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="/">
          <img src="/logo/logo.jpg" alt="ClickNCart Logo" class="h-16 w-auto">
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li id="userNavLinks">
          <a href="/user-orders">Orders</a>
        </li>
        <li id="userNavLinks2">
          <a href="/checkout">Checkout</a>
        </li>
        <li id="userNavLinks3">
          <a href="/cart">Cart</a>
        </li>
        <li><a href="/contact">Contact</a></li>
      </ul>
      <div id="navAuth" class="flex items-center space-x-4">
        <!-- Guest links -->
        <div id="guestLinks" class="flex space-x-4">
          <a href="/login" class="btn btn-outline">Login</a>
          <a href="/register" class="btn btn-primary">Sign Up</a>
        </div>
        <!-- User dropdown (hidden by default) -->
        <div id="userLinks" class="relative hidden">
          <button id="userBtn" class="flex items-center space-x-1 px-4 py-2 rounded hover:bg-gray-100 transition">
            <span id="userName" class="font-medium"></span>
            <i class="fas fa-chevron-down text-gray-600"></i>
          </button>
          <div id="userDropdown" class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded shadow-lg hidden">
            <a href="/user-profile" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">My Profile</a>
            <button id="logoutBtn" class="w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100">
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mx-auto px-4 py-8 pt-28"> <!-- Added pt-28 to account for fixed header -->
    <h2 class="text-4xl font-bold mb-6">My Wishlist</h2>
    <div id="wishlist-grid"
         class="grid gap-6
                grid-cols-1
                sm:grid-cols-2
                md:grid-cols-3
                lg:grid-cols-4">
      <!-- products will inject here -->
    </div>
  </main>

  <script>
    const API = '/api/wishlist';
    const token = localStorage.getItem('auth_token');

    function showNotification(msg, success = true) {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert ${success ? 'alert-success' : 'alert-error'} fixed bottom-4 right-4 shadow-lg`;
      alertDiv.innerHTML = `<span>${msg}</span>`;
      document.body.appendChild(alertDiv);
      setTimeout(() => alertDiv.remove(), 3000);
    }

    function setupHeaderAuth() {
      const userStr = localStorage.getItem('user');
      const authToken = localStorage.getItem('auth_token');
      let user = null;

      try {
        user = userStr ? JSON.parse(userStr) : null;
      } catch (e) {
        console.error('Failed to parse user from localStorage', e);
      }

      const guestLinks = document.getElementById('guestLinks');
      const userLinks = document.getElementById('userLinks');
      const userNameEl = document.getElementById('userName');
      const dropdown = document.getElementById('userDropdown');
      
      if (authToken && user && user.role === 'user') {
        // Show user menu and navigation links
        guestLinks.classList.add('hidden');
        userLinks.classList.remove('hidden');
        userNameEl.textContent = `Welcome, ${user.name}`;

        // Toggle dropdown on click
        document.getElementById('userBtn').addEventListener('click', () => {
          dropdown.classList.toggle('hidden');
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user');
          window.location.href = '/';
        });

        // Click outside to close
        document.addEventListener('click', e => {
          if (!userLinks.contains(e.target)) {
            dropdown.classList.add('hidden');
          }
        });
      } else {
        // No user or not a regular user → show guest, hide menu
        guestLinks.classList.remove('hidden');
        userLinks.classList.add('hidden');
      }
    }

    async function loadWishlist() {
      if (!token) {
        showNotification('Please log in to view your wishlist', false);
        return;
      }
      try {
        const res = await fetch(API, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const { success, data, message } = await res.json();
        if (!success) throw new Error(message || 'Failed to load');
        const grid = document.getElementById('wishlist-grid');
        grid.innerHTML = data.map(p => `
          <div class="card bg-base-100 shadow hover:shadow-lg transition">
            <figure class="h-40 overflow-hidden">
              <img src="${p.images[0] || 'https://via.placeholder.com/300'}"
                   alt="${p.name}"
                   class="w-full h-full object-cover"/>
            </figure>
            <div class="card-body p-4">
              <h3 class="card-title text-lg">${p.name}</h3>
              <p class="text-gray-500 text-sm line-clamp-2">${p.description||''}</p>
              <div class="card-actions justify-end mt-4">
                <button onclick="removeFromWishlist(${p.id})"
                        class="btn btn-error btn-sm">
                  Remove
                </button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        showNotification(err.message, false);
      }
    }

    async function removeFromWishlist(id) {
      try {
        const res = await fetch(`${API}/remove/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const { success, message } = await res.json();
        showNotification(message, success);
        if (success) loadWishlist();
      } catch (err) {
        console.error(err);
        showNotification('Could not remove item', false);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadWishlist();
      setupHeaderAuth();
    });
  </script>
</body>
</html>

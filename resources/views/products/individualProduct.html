<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ClickNCart</title>
    <link rel="preload" href="./font/mosvita.otf" as="font" type="font/otf" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
         @font-face {
            font-family: 'Mosvita';
            src: url('./font/mosvita.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5649c0;
            --secondary: #00cec9;
            --dark: #2d3436;
            --light: #f5f6fa;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
             font-family: 'Poppins', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            background-color: white;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
             font-family: 'Poppins', sans-serif;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .logo i {
            margin-right: 10px;
            color: var(--secondary);
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background: var(--primary);
            bottom: -5px;
            left: 0;
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .auth-buttons .btn {
            margin-left: 1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: 2px solid var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        /* Main Content */
        .main-content {
            padding: 8rem 5% 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 5px;
        }

        .breadcrumb span {
            margin: 0 5px;
        }

        /* Product Container */
        .product-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 992px) {
            .product-container {
                grid-template-columns: 1fr;
            }
        }

        /* Product Gallery */
        .product-gallery {
            position: relative;
        }

        .main-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
            border-radius: 8px;
            background: #f9f9f9;
            margin-bottom: 1rem;
        }

        .thumbnail-container {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 5px;
            background: #f9f9f9;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .thumbnail:hover, .thumbnail.active {
            border-color: var(--primary);
        }

        /* Product Details */
        .product-details h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .product-brand {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .product-rating {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .stars {
            color: var(--warning);
            margin-right: 0.5rem;
        }

        .rating-count {
            color: #666;
            font-size: 0.9rem;
        }

        .rate-product {
            margin-left: 1rem;
            display: none; /* Initially hidden, shown for logged-in users */
        }

        .rate-product select {
            padding: 0.3rem;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-right: 0.5rem;
        }

        .rate-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .rate-btn:hover {
            background: var(--primary-dark);
        }

        .price-container {
            margin: 1.5rem 0;
        }

        .current-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stock-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: var(--success);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-left: 1rem;
        }

        .out-of-stock {
            background: var(--danger);
        }

        .product-description {
            margin: 1.5rem 0;
            line-height: 1.6;
            color: #555;
        }

        /* Variants */
        .variant-section {
            margin: 1.5rem 0;
        }

        .variant-title {
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .variant-options {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .variant-option {
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .variant-option:hover {
            border-color: var(--primary);
        }

        .variant-option.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Quantity */
        .quantity-control {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }

        .quantity-label {
            margin-right: 1rem;
            font-weight: 600;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .quantity-btn:hover {
            background: #e0e0e0;
        }

        .quantity-input {
            width: 60px;
            height: 40px;
            text-align: center;
            border: none;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            font-size: 1rem;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .add-to-cart {
            padding: 0.8rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-to-cart:hover {
            background: var(--primary-dark);
        }

        .add-to-cart:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

 
        /* Specifications */
        .specifications {
            margin-top: 3rem;
        }

        .specifications h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .spec-item {
            margin-bottom: 1rem;
        }

        .spec-name {
            font-weight: 600;
            color: #666;
        }

        .spec-value {
            margin-top: 0.3rem;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 5px;
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transform: translateX(200%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success);
        }

        .notification.error {
            background: var(--danger);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 1rem;
            }

            .nav-links {
                margin-top: 1rem;
            }

            .nav-links li {
                margin-left: 1rem;
                margin-right: 1rem;
            }

            .auth-buttons {
                margin-top: 1rem;
            }

            .main-content {
                padding-top: 7rem;
            }

            .product-container {
                padding: 1rem;
            }

            .main-image {
                height: 300px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .add-to-cart, .wishlist-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-shopping-cart"></i>
                <span>ClickNCart</span>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/checkout">Checkout</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="#" class="btn btn-outline" id="loginBtn">Login</a>
                <a href="#" class="btn btn-primary" id="signupBtn">Sign Up</a>
            </div>
        </nav>
    </header>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span>/</span>
            <a href="#" id="categoryLink">Category</a>
            <span>/</span>
            <span id="productNameBreadcrumb">Product</span>
        </div>

        <!-- Product Container -->
        <div class="product-container animate__animated animate__fadeIn">
            <!-- Product Gallery -->
            <div class="product-gallery">
                <img src="https://via.placeholder.com/600" alt="Product Image" class="main-image" id="mainImage">
                <div class="thumbnail-container" id="thumbnailContainer">
                    <!-- Thumbnails will be dynamically inserted here -->
                </div>
            </div>

            <!-- Product Details -->
            <div class="product-details">
                <h1 id="productName">Product Name</h1>
                <div class="product-brand" id="productBrand">Brand: <span></span></div>
                
                <div class="product-rating">
                    <div class="stars" id="productStars">
                        <!-- Stars will be dynamically inserted here -->
                    </div>
                    <div class="rating-count" id="ratingCount">(0 reviews)</div>
                    <div class="rate-product" id="rateProductContainer">
                        <select id="ratingSelect">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5" selected>5</option>
                        </select>
                        <button class="rate-btn" id="rateProductBtn">Rate</button>
                    </div>
                </div>
                
                <div class="price-container">
                    <span class="current-price" id="productPrice">$0.00</span>
                    <span class="stock-status" id="stockStatus">In Stock</span>
                </div>
                
                <div class="product-description" id="productDescription">
                    Product description will be loaded here...
                </div>
                
                <!-- Variants -->
                <div class="variant-section" id="variantSection">
                    <div class="variant-title">Color:</div>
                    <div class="variant-options" id="variantOptions">
                        <!-- Variant options will be dynamically inserted here -->
                    </div>
                </div>
                
                <!-- Quantity -->
                <div class="quantity-control">
                    <div class="quantity-label">Quantity:</div>
                    <div class="quantity-selector">
                        <button class="quantity-btn" id="decreaseQty"><i class="fas fa-minus"></i></button>
                        <input type="text" class="quantity-input" value="1" id="quantityInput">
                        <button class="quantity-btn" id="increaseQty"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="add-to-cart" id="addToCartBtn" disabled>
                        <i class="fas fa-shopping-cart"></i> Add to Cart
                    </button>
                    
                </div>
                
                <!-- Specifications -->
                <div class="specifications" id="specificationsSection">
                    <h2>Specifications</h2>
                    <div class="specs-grid" id="specsGrid">
                        <!-- Specifications will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Base URL for API
                        const API_BASE_URL = '';
        
        // DOM Elements
        const notification = document.getElementById('notification');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const productName = document.getElementById('productName');
        const productBrand = document.getElementById('productBrand');
        const productStars = document.getElementById('productStars');
        const ratingCount = document.getElementById('ratingCount');
        const rateProductContainer = document.getElementById('rateProductContainer');
        const ratingSelect = document.getElementById('ratingSelect');
        const rateProductBtn = document.getElementById('rateProductBtn');
        const productPrice = document.getElementById('productPrice');
        const stockStatus = document.getElementById('stockStatus');
        const productDescription = document.getElementById('productDescription');
        const variantSection = document.getElementById('variantSection');
        const variantOptions = document.getElementById('variantOptions');
        const decreaseQty = document.getElementById('decreaseQty');
        const increaseQty = document.getElementById('increaseQty');
        const quantityInput = document.getElementById('quantityInput');
        const addToCartBtn = document.getElementById('addToCartBtn');
        const specificationsSection = document.getElementById('specificationsSection');
        const specsGrid = document.getElementById('specsGrid');
        const mainImage = document.getElementById('mainImage');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const categoryLink = document.getElementById('categoryLink');
        const productNameBreadcrumb = document.getElementById('productNameBreadcrumb');

        // Get product ID from URL
          const productId = '<!--PRODUCT_ID-->';
        let selectedVariant = null;
        let productData = null;

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', () => {
            const authToken = localStorage.getItem('auth_token');
            
            // Set login/signup button hrefs
            loginBtn.href = '/login';
            signupBtn.href = '/register';
            
            // Fetch product details
            fetchProductDetails(productId);
            
            // Enable/disable buttons based on auth
            if (authToken) {
                rateProductContainer.style.display = 'block';
                addToCartBtn.disabled = false;
            } else {
                rateProductContainer.style.display = 'none';
                addToCartBtn.disabled = true;
            }
        });

        // Fetch product details from API
        async function fetchProductDetails(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/product/id/${id}`);
                const data = await response.json();
                
                if (data.success) {
                    productData = data.data;
                    displayProductDetails(data.data);
                } else {
                    throw new Error(data.message || 'Failed to load product details');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Failed to load product details', false);
            }
        }

        // Display product details
        function displayProductDetails(product) {
            // Basic info
            productName.textContent = product.name;
            productNameBreadcrumb.textContent = product.name;
            productBrand.querySelector('span').textContent = product.brand;
            productPrice.textContent = `$${product.price.toFixed(2)}`;
            productDescription.textContent = product.description;
            
            // Stock status
            if (product.stock_quantity > 0) {
                stockStatus.textContent = 'In Stock';
                stockStatus.classList.remove('out-of-stock');
            } else {
                stockStatus.textContent = 'Out of Stock';
                stockStatus.classList.add('out-of-stock');
                addToCartBtn.disabled = true;
            }
            
            // Category link
            categoryLink.textContent = product.category;
            categoryLink.href = `/category/${product.category.toLowerCase()}`;
            
            // Ratings
            updateRatingDisplay(product.ratings);
            
            // Images
            displayProductImages(product.images);
            
            // Variants
            if (product.variants && product.variants.length > 0) {
                displayVariants(product.variants);
            } else {
                variantSection.style.display = 'none';
            }
            
            // Specifications
            if (product.specifications) {
                displaySpecifications(product.specifications);
            } else {
                specificationsSection.style.display = 'none';
            }
        }

        // Update rating display
        function updateRatingDisplay(ratings) {
            // Clear existing stars
            productStars.innerHTML = '';
            
            const averageRating = ratings.average || 0;
            const ratingCountValue = ratings.count || 0;
            
            // Add full stars
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');
                star.className = i <= averageRating ? 'fas fa-star' : 'far fa-star';
                productStars.appendChild(star);
            }
            
            // Update rating count text
            ratingCount.textContent = `(${ratingCountValue} review${ratingCountValue !== 1 ? 's' : ''})`;
        }

        // Display product images
        function displayProductImages(images) {
            // Clear existing thumbnails
            thumbnailContainer.innerHTML = '';
            
            if (images.length === 0) {
                // Use placeholder if no images
                mainImage.src = 'https://via.placeholder.com/600';
                const thumbnail = document.createElement('img');
                thumbnail.src = 'https://via.placeholder.com/100';
                thumbnail.className = 'thumbnail active';
                thumbnailContainer.appendChild(thumbnail);
                return;
            }
            
            // Set main image to first image
            mainImage.src = images[0];
            
            // Create thumbnails
            images.forEach((img, index) => {
                const thumbnail = document.createElement('img');
                thumbnail.src = img;
                thumbnail.className = `thumbnail ${index === 0 ? 'active' : ''}`;
                thumbnail.alt = `Thumbnail ${index + 1}`;
                
                thumbnail.addEventListener('click', () => {
                    // Update main image
                    mainImage.src = img;
                    
                    // Update active thumbnail
                    document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                    thumbnail.classList.add('active');
                });
                
                thumbnailContainer.appendChild(thumbnail);
            });
        }

        // Display variants
        function displayVariants(variants) {
            // Clear existing variants
            variantOptions.innerHTML = '';
            
            variants.forEach((variant, index) => {
                const variantOption = document.createElement('div');
                variantOption.className = 'variant-option';
                variantOption.textContent = variant.color;
                variantOption.dataset.variantId = variant.variant_id;
                
                // Select first variant by default
                if (index === 0) {
                    variantOption.classList.add('selected');
                    selectedVariant = variant;
                }
                
                variantOption.addEventListener('click', () => {
                    // Update selected variant
                    document.querySelectorAll('.variant-option').forEach(v => v.classList.remove('selected'));
                    variantOption.classList.add('selected');
                    selectedVariant = variant;
                    
                    // Update stock status
                    if (variant.stock > 0) {
                        stockStatus.textContent = 'In Stock';
                        stockStatus.classList.remove('out-of-stock');
                        addToCartBtn.disabled = false;
                    } else {
                        stockStatus.textContent = 'Out of Stock';
                        stockStatus.classList.add('out-of-stock');
                        addToCartBtn.disabled = true;
                    }
                });
                
                variantOptions.appendChild(variantOption);
            });
        }

        // Display specifications
        function displaySpecifications(specs) {
            // Clear existing specs
            specsGrid.innerHTML = '';
            
            for (const [key, value] of Object.entries(specs)) {
                const specItem = document.createElement('div');
                specItem.className = 'spec-item';
                
                const specName = document.createElement('div');
                specName.className = 'spec-name';
                specName.textContent = key.replace(/_/g, ' ');
                
                const specValue = document.createElement('div');
                specValue.className = 'spec-value';
                specValue.textContent = value;
                
                specItem.appendChild(specName);
                specItem.appendChild(specValue);
                specsGrid.appendChild(specItem);
            }
        }

        // Quantity controls
        decreaseQty.addEventListener('click', () => {
            let qty = parseInt(quantityInput.value);
            if (qty > 1) {
                quantityInput.value = qty - 1;
            }
        });

        increaseQty.addEventListener('click', () => {
            let qty = parseInt(quantityInput.value);
            const maxQty = selectedVariant ? selectedVariant.stock : productData.stock_quantity;
            
            if (qty < maxQty) {
                quantityInput.value = qty + 1;
            } else {
                showNotification(`Maximum available quantity is ${maxQty}`, false);
            }
        });

        quantityInput.addEventListener('change', () => {
            let qty = parseInt(quantityInput.value) || 1;
            const maxQty = selectedVariant ? selectedVariant.stock : productData.stock_quantity;
            
            if (qty < 1) {
                quantityInput.value = 1;
            } else if (qty > maxQty) {
                quantityInput.value = maxQty;
                showNotification(`Maximum available quantity is ${maxQty}`, false);
            }
        });

        // Add to cart
        addToCartBtn.addEventListener('click', async () => {
            const token = localStorage.getItem('auth_token');
            
            if (!token) {
                showNotification('Please login to add items to cart', false);
                return;
            }

            try {
                // Show loading state
                addToCartBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';
                addToCartBtn.disabled = true;

                // Make API call to add to cart
                const response = await fetch(`${API_BASE_URL}/api/cart/add`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        product_id: parseInt(productId),
                        quantity: parseInt(quantityInput.value)
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to add to cart');
                }

                if (data.success) {
                    // Show success notification
                    showNotification(data.message || 'Product added to cart successfully', true);
                } else {
                    throw new Error(data.message || 'Failed to add to cart');
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                showNotification(error.message || 'Failed to add to cart', false);
            } finally {
                // Reset button state
                addToCartBtn.innerHTML = '<i class="fas fa-shopping-cart"></i> Add to Cart';
                addToCartBtn.disabled = false;
            }
        });

        // Rate product
        rateProductBtn.addEventListener('click', async () => {
            const token = localStorage.getItem('auth_token');
            
            if (!token) {
                showNotification('Please login to rate products', false);
                return;
            }

            try {
                // Show loading state
                rateProductBtn.textContent = 'Rating...';
                rateProductBtn.disabled = true;

                // Make API call to rate product
                const response = await fetch(`${API_BASE_URL}/api/products/${productId}/rate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        rating: parseInt(ratingSelect.value)
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to rate product');
                }

                if (data.success) {
                    // Show success notification
                    showNotification(data.message || 'Product rated successfully', true);
                    
                    // Update rating display
                    updateRatingDisplay(data.data.ratings);
                } else {
                    throw new Error(data.message || 'Failed to rate product');
                }
            } catch (error) {
                console.error('Error rating product:', error);
                showNotification(error.message || 'Failed to rate product', false);
            } finally {
                // Reset button state
                rateProductBtn.textContent = 'Rate';
                rateProductBtn.disabled = false;
            }
        });

        // Show notification
        function showNotification(message, isSuccess) {
            notification.textContent = message;
            notification.className = `notification ${isSuccess ? 'success' : 'error'}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickNCart - Browse Products</title>
    <link rel="preload" href="./font/mosvita.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>

        @font-face {
            font-family: 'Mosvita';
            src: url('./font/mosvita.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --primary-color: #4361ee;
            --primary-dark: #3a56d4;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --gray-color: #6c757d;
            --light-gray: #e9ecef;
            --success-color: #4bb543;
            --error-color: #ff3333;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
               font-family: 'Mosvita', 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .main-header {
            background-color: white;
            box-shadow: var(--box-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 0;
        }

        .main-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo h1 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 24px;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 500px;
            display: flex;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius) 0 0 var(--border-radius);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--primary-color);
        }

        .search-bar button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-bar button:hover {
            background-color: var(--primary-dark);
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--dark-color);
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .btn-icon:hover {
            background-color: var(--light-gray);
        }

        .cart-count {
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .main-container {
            display: flex;
            gap: 30px;
            padding: 30px 0;
        }

        .filters-sidebar {
            width: 280px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 90px;
        }

        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filters-header h3 {
            font-size: 18px;
        }

        .close-filters {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray-color);
        }

        .filter-section {
            margin-bottom: 25px;
        }

        .filter-section h4 {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--dark-color);
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-option input {
            margin-right: 5px;
        }

        .price-range {
            padding: 0 10px;
        }

        .price-range input[type="range"] {
            width: 100%;
            margin: 10px 0;
            -webkit-appearance: none;
            height: 6px;
            background: var(--light-gray);
            border-radius: 3px;
            outline: none;
        }

        .price-range input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }

        .price-values {
            display: flex;
            justify-content: space-between;
        }

        .rating-filter select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .rating-filter select:focus {
            border-color: var(--primary-color);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
               font-family: 'Mosvita', 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-color);
            color: white;
            flex-grow: 1;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
               font-family: 'Mosvita', 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-color);
            flex-grow: 1;
        }

        .btn-secondary:hover {
            background-color: #d1d7e0;
        }

        .products-container {
            flex-grow: 1;
        }

        .sort-options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sort-options select {
            padding: 8px 12px;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .sort-options select:focus {
            border-color: var(--primary-color);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--primary-color);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-description {
            font-size: 14px;
            color: var(--gray-color);
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        .product-rating .stars {
            color: #ffc107;
        }

        .product-rating .count {
            font-size: 12px;
            color: var(--gray-color);
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .product-actions .btn {
            flex-grow: 1;
            padding: 8px 12px;
            font-size: 14px;
        }

        .view-details {
            background-color: var(--light-gray);
            color: var(--dark-color);
        }

        .view-details:hover {
            background-color: #d1d7e0;
        }

        .add-to-cart {
            background-color: var(--primary-color);
            color: white;
               font-family: 'Mosvita', 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .add-to-cart:hover {
            background-color: var(--primary-dark);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
        }

        .pagination button {
            width: 40px;
            height: 40px;
            border: 1px solid var(--light-gray);
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .pagination button:hover:not(.active):not(:disabled) {
            background-color: var(--light-gray);
        }

        .pagination button.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--light-gray);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray-color);
        }

        .modal-body {
            padding: 30px;
        }

        .quick-view-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .quick-view-image {
            position: relative;
            height: 400px;
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .quick-view-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .quick-view-details h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: var(--dark-color);
        }

        .quick-view-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .quick-view-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-view-rating .stars {
            color: #ffc107;
            font-size: 18px;
        }

        .quick-view-rating .count {
            color: var(--gray-color);
        }

        .quick-view-description {
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .quick-view-specs {
            margin-bottom: 25px;
        }

        .quick-view-specs h4 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .quick-view-specs ul {
            list-style: none;
        }

        .quick-view-specs li {
            margin-bottom: 5px;
            display: flex;
        }

        .quick-view-specs li strong {
            min-width: 120px;
            display: inline-block;
            color: var(--gray-color);
        }

        .quick-view-actions {
            display: flex;
            gap: 15px;
        }

        .quick-view-actions .btn {
            padding: 12px 25px;
            font-size: 16px;
        }

        /* Responsive styles */
        @media (max-width: 992px) {
            .filters-sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                z-index: 1000;
                transform: translateX(-100%);
                transition: var(--transition);
                overflow-y: auto;
            }
            
            .filters-sidebar.active {
                transform: translateX(0);
            }
            
            .close-filters {
                display: block;
            }
            
            .main-container {
                flex-direction: column;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .main-header .container {
                flex-wrap: wrap;
            }
            
            .search-bar {
                order: 3;
                width: 100%;
                margin-top: 15px;
            }
            
            .quick-view-content {
                grid-template-columns: 1fr;
            }
            
            .quick-view-image {
                height: 300px;
            }
        }

        @media (max-width: 576px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .product-actions {
                flex-direction: column;
            }
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: white;
            padding: 15px 25px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--box-shadow);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        .notification.fade-out {
            animation: fadeOut 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        
        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--error-color);
        }
        
        .error-message i {
            font-size: 50px;
            margin-bottom: 20px;
        }
        
        .no-products {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px 20px;
        }
        
        .no-products i {
            font-size: 50px;
            color: var(--gray-color);
            margin-bottom: 20px;
        }

        .navigation-container {
    display: flex;
    gap: 2rem;
}

.navigation {
    font-family: 'Mosvita', 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: black;
    text-decoration: none;
}

    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <h1>ClickNCart</h1>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search products...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="navigation-container">
    <a class="navigation" href="/">Home</a>
    <a class="navigation" href="/products">Products</a>
    <a class="navigation" href="/contact">Contact</a>
</div>

            <div class="header-actions">
                <button class="btn-icon" id="filter-toggle">
                    <i class="fas fa-filter"></i>
                    <span>Filters</span>
                </button>
               <a href="/checkout" class="btn-icon">
    <i class="fas fa-shopping-cart"></i>
    <span class="cart-count">0</span>
</a>

            </div>
        </div>
    </header>

    <div class="container main-container">
        <aside class="filters-sidebar" id="filters-sidebar">
            <div class="filters-header">
                <h3>Filters</h3>
                <button class="close-filters" id="close-filters">&times;</button>
            </div>
            
            <div class="filter-section">
                <h4>Categories</h4>
                <div class="filter-options" id="category-filters"></div>
            </div>
            
            <div class="filter-section">
                <h4>Subcategories</h4>
                <div class="filter-options" id="subcategory-filters"></div>
            </div>
            
            <div class="filter-section">
                <h4>Brands</h4>
                <div class="filter-options" id="brand-filters"></div>
            </div>
            
            <div class="filter-section">
                <h4>Price Range</h4>
                <div class="price-range">
                    <input type="range" id="price-range" min="0" max="1000" step="10">
                    <div class="price-values">
                        <span id="min-price">NPR 0</span>
                        <span id="max-price">NPR 1000000</span>
                    </div>
                </div>
            </div>
            
            <div class="filter-section">
                <h4>Rating</h4>
                <div class="rating-filter">
                    <select id="min-rating">
                        <option value="0">Any Rating</option>
                        <option value="4">4+ Stars</option>
                        <option value="3">3+ Stars</option>
                        <option value="2">2+ Stars</option>
                        <option value="1">1+ Stars</option>
                    </select>
                </div>
            </div>
            
            <div class="filter-actions">
                <button class="btn btn-secondary" id="reset-filters">Reset</button>
                <button class="btn btn-primary" id="apply-filters">Apply</button>
            </div>
        </aside>

        <main class="products-container">
            <div class="sort-options">
                <label for="sort-by">Sort by:</label>
                <select id="sort-by">
                    <option value="newest">Newest</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="rating">Rating</option>
                    <option value="featured">Featured</option>
                </select>
            </div>
            
            <div class="loading-spinner" id="loading-spinner">
                <div class="spinner"></div>
                <p>Loading products...</p>
            </div>
            
            <div class="products-grid" id="products-grid"></div>
            
            <div class="pagination" id="pagination"></div>
        </main>
    </div>

    <!-- Product Quick View Modal -->
    <div class="modal" id="quick-view-modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-body" id="quick-view-content"></div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS animation library
        AOS.init();

        // DOM Elements
        const productsGrid = document.getElementById('products-grid');
        const pagination = document.getElementById('pagination');
        const loadingSpinner = document.getElementById('loading-spinner');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const filterToggle = document.getElementById('filter-toggle');
        const closeFilters = document.getElementById('close-filters');
        const filtersSidebar = document.getElementById('filters-sidebar');
        const applyFiltersBtn = document.getElementById('apply-filters');
        const resetFiltersBtn = document.getElementById('reset-filters');
        const sortBySelect = document.getElementById('sort-by');
        const quickViewModal = document.getElementById('quick-view-modal');
        const quickViewContent = document.getElementById('quick-view-content');
        const closeModal = document.querySelector('.close-modal');

        // API Configuration
            const API_BASE_URL = '/api'; // Replace with your actual API URL
        let currentPage = 1;
        let totalPages = 1;
        let currentFilters = {
            category: null,
            subcategory: null,
            brand: null,
            minPrice: null,
            maxPrice: null,
            minRating: null,
            sortBy: 'newest',
            query: null,
            perPage: 12
        };

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            // Load available filters
            loadAvailableFilters();
            
            // Load initial products
            loadProducts();
            
            // Set up event listeners
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search functionality
            searchBtn.addEventListener('click', () => {
                currentFilters.query = searchInput.value.trim();
                currentPage = 1;
                loadProducts();
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentFilters.query = searchInput.value.trim();
                    currentPage = 1;
                    loadProducts();
                }
            });
            
            // Filter sidebar toggle
            filterToggle.addEventListener('click', () => {
                filtersSidebar.classList.add('active');
            });
            
            closeFilters.addEventListener('click', () => {
                filtersSidebar.classList.remove('active');
            });
            
            // Apply filters
            applyFiltersBtn.addEventListener('click', () => {
                applyFilters();
                filtersSidebar.classList.remove('active');
                currentPage = 1;
                loadProducts();
            });
            
            // Reset filters
            resetFiltersBtn.addEventListener('click', () => {
                resetFilters();
                currentPage = 1;
                loadProducts();
            });
            
            // Sort by
            sortBySelect.addEventListener('change', () => {
                currentFilters.sortBy = sortBySelect.value;
                currentPage = 1;
                loadProducts();
            });
            
            // Price range slider
            const priceRange = document.getElementById('price-range');
            const minPriceDisplay = document.getElementById('min-price');
            const maxPriceDisplay = document.getElementById('max-price');
            
            priceRange.addEventListener('input', () => {
                maxPriceDisplay.textContent = `$${priceRange.value}`;
            });
            
            // Modal close
            closeModal.addEventListener('click', () => {
                quickViewModal.style.display = 'none';
            });
            
            window.addEventListener('click', (e) => {
                if (e.target === quickViewModal) {
                    quickViewModal.style.display = 'none';
                }
            });
        }

        async function loadAvailableFilters() {
            try {
                const response = await fetch(`${API_BASE_URL}/products/filters`);
                const data = await response.json();
                
                if (data.success) {
                    renderFilterOptions(data.data);
                }
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        function renderFilterOptions(filters) {
            // Categories
            const categoryFilters = document.getElementById('category-filters');
            categoryFilters.innerHTML = '';
            
            filters.categories.forEach(category => {
                const option = document.createElement('div');
                option.className = 'filter-option';
                option.innerHTML = `
                    <input type="radio" name="category" id="category-${category}" value="${category}">
                    <label for="category-${category}">${category}</label>
                `;
                categoryFilters.appendChild(option);
            });
            
            // Subcategories
            const subcategoryFilters = document.getElementById('subcategory-filters');
            subcategoryFilters.innerHTML = '';
            
            filters.subcategories.forEach(subcategory => {
                const option = document.createElement('div');
                option.className = 'filter-option';
                option.innerHTML = `
                    <input type="radio" name="subcategory" id="subcategory-${subcategory}" value="${subcategory}">
                    <label for="subcategory-${subcategory}">${subcategory}</label>
                `;
                subcategoryFilters.appendChild(option);
            });
            
            // Brands
            const brandFilters = document.getElementById('brand-filters');
            brandFilters.innerHTML = '';
            
            filters.brands.forEach(brand => {
                const option = document.createElement('div');
                option.className = 'filter-option';
                option.innerHTML = `
                    <input type="radio" name="brand" id="brand-${brand}" value="${brand}">
                    <label for="brand-${brand}">${brand}</label>
                `;
                brandFilters.appendChild(option);
            });
            
            // Price range
            const priceRange = document.getElementById('price-range');
            const minPriceDisplay = document.getElementById('min-price');
            const maxPriceDisplay = document.getElementById('max-price');
            
            priceRange.min = filters.price_range.min;
            priceRange.max = filters.price_range.max;
            priceRange.value = filters.price_range.max;
            minPriceDisplay.textContent = `NPR${filters.price_range.min}`;
            maxPriceDisplay.textContent = `NPR${filters.price_range.max}`;
        }

        function applyFilters() {
            // Category
            const selectedCategory = document.querySelector('input[name="category"]:checked');
            currentFilters.category = selectedCategory ? selectedCategory.value : null;
            
            // Subcategory
            const selectedSubcategory = document.querySelector('input[name="subcategory"]:checked');
            currentFilters.subcategory = selectedSubcategory ? selectedSubcategory.value : null;
            
            // Brand
            const selectedBrand = document.querySelector('input[name="brand"]:checked');
            currentFilters.brand = selectedBrand ? selectedBrand.value : null;
            
            // Price
            const priceRange = document.getElementById('price-range');
            currentFilters.maxPrice = priceRange.value;
            
            // Rating
            const minRating = document.getElementById('min-rating');
            currentFilters.minRating = minRating.value !== '0' ? minRating.value : null;
        }

        function resetFilters() {
            // Reset UI
            document.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.checked = false;
            });
            
            const priceRange = document.getElementById('price-range');
            const maxPriceDisplay = document.getElementById('max-price');
            priceRange.value = priceRange.max;
            maxPriceDisplay.textContent = `$${priceRange.max}`;
            
            document.getElementById('min-rating').value = '0';
            sortBySelect.value = 'newest';
            
            // Reset filters object
            currentFilters = {
                category: null,
                subcategory: null,
                brand: null,
                minPrice: null,
                maxPrice: null,
                minRating: null,
                sortBy: 'newest',
                query: null,
                perPage: 12
            };
            
            searchInput.value = '';
        }

        async function loadProducts() {
            // Show loading spinner
            loadingSpinner.style.display = 'flex';
            productsGrid.innerHTML = '';
            pagination.innerHTML = '';
            
            try {
                // Build query parameters
                const params = new URLSearchParams();
                
                if (currentFilters.query) params.append('query', currentFilters.query);
                if (currentFilters.category) params.append('category', currentFilters.category);
                if (currentFilters.subcategory) params.append('subcategory', currentFilters.subcategory);
                if (currentFilters.brand) params.append('brand', currentFilters.brand);
                if (currentFilters.maxPrice) params.append('max_price', currentFilters.maxPrice);
                if (currentFilters.minRating) params.append('min_rating', currentFilters.minRating);
                if (currentFilters.sortBy) params.append('sort_by', currentFilters.sortBy);
                params.append('per_page', currentFilters.perPage);
                params.append('page', currentPage);
                
                // Determine which endpoint to use based on filters
                let endpoint = '/products/homepage';
                if (currentFilters.query && !currentFilters.category && !currentFilters.brand) {
                    endpoint = '/products/normal-search';
                } else if (currentFilters.category) {
                    endpoint = `/products/category/${currentFilters.category}`;
                }
                
                const response = await fetch(`${API_BASE_URL}${endpoint}?${params.toString()}`);
                const data = await response.json();
                
                if (data.success) {
                    renderProducts(data.data);
                    renderPagination(data.meta);
                } else {
                    throw new Error(data.message || 'Failed to load products');
                }
            } catch (error) {
                console.error('Error loading products:', error);
                productsGrid.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Failed to load products. Please try again later.</p>
                    </div>
                `;
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        function renderProducts(products) {
            productsGrid.innerHTML = '';
            
            if (products.length === 0) {
                productsGrid.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-search"></i>
                        <h3>No products found</h3>
                        <p>Try adjusting your search or filters</p>
                        <button class="btn btn-primary" id="reset-filters-btn">Reset Filters</button>
                    </div>
                `;
                
                document.getElementById('reset-filters-btn').addEventListener('click', () => {
                    resetFilters();
                    currentPage = 1;
                    loadProducts();
                });
                
                return;
            }
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.setAttribute('data-aos', 'fade-up');
                
                // Format price
                const formattedPrice = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'NPR'
                }).format(product.price);
                
                // Create rating stars
                const rating = product.ratings?.average || 0;
                const stars = Array(5).fill().map((_, i) => 
                    i < Math.floor(rating) ? '<i class="fas fa-star"></i>' : 
                    i < rating ? '<i class="fas fa-star-half-alt"></i>' : 
                    '<i class="far fa-star"></i>'
                ).join('');
                
                productCard.innerHTML = `
                    <div class="product-image">
                        <img src="${product.images[0] || 'https://via.placeholder.com/300'}" alt="${product.name}">
                        ${product.is_featured ? '<span class="product-badge">Featured</span>' : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                        <div class="product-price">${formattedPrice}</div>
                        <div class="product-rating">
                            <div class="stars">${stars}</div>
                            <span class="count">(${product.ratings?.count || 0})</span>
                        </div>
                        <div class="product-actions">
                            <button class="btn view-details" data-id="${product.product_id}">View Details</button>
                            <button class="btn add-to-cart" data-id="${product.id}">Add to Cart</button>
                        </div>
                    </div>
                `;
                
                productsGrid.appendChild(productCard);
            });
            
            // Add event listeners to view details buttons
            document.querySelectorAll('.view-details').forEach(button => {
                button.addEventListener('click', (e) => {
                    const productId = e.target.getAttribute('data-id');
                    showProductDetails(productId);
                });
            });
            
            // Add event listeners to add to cart buttons
            document.querySelectorAll('.add-to-cart').forEach(button => {
                button.addEventListener('click', (e) => {
                    const productId = e.target.getAttribute('data-id');
                    addToCart(productId);
                });
            });
        }

        function renderPagination(meta) {
            pagination.innerHTML = '';
            totalPages = meta.total / meta.per_page;
            
            if (meta.total <= meta.per_page) return;
            
            // Previous button
            const prevButton = document.createElement('button');
            prevButton.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevButton.disabled = currentPage === 1;
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadProducts();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            pagination.appendChild(prevButton);
            
            // Page numbers
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(startPage + 4, Math.ceil(totalPages));
            
            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = i === currentPage ? 'active' : '';
                pageButton.addEventListener('click', () => {
                    currentPage = i;
                    loadProducts();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                            pagination.appendChild(pageButton);
        }
        
        // Next button
        const nextButton = document.createElement('button');
        nextButton.innerHTML = '<i class="fas fa-chevron-right"></i>';
        nextButton.disabled = currentPage >= Math.ceil(totalPages);
        nextButton.addEventListener('click', () => {
            if (currentPage < Math.ceil(totalPages)) {
                currentPage++;
                loadProducts();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        pagination.appendChild(nextButton);
    }

    async function showProductDetails(productId) {
        try {
            // Show loading state in modal
            quickViewContent.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Loading product details...</p>
                </div>
            `;
            
            quickViewModal.style.display = 'flex';
            
            const response = await fetch(`${API_BASE_URL}/product/id/${productId}`, {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}` // Add auth if needed
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                const product = data.data;
                
                // Format price
                const formattedPrice = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'NPR'
                }).format(product.price);
                
                // Create rating stars
                const rating = product.ratings?.average || 0;
                const stars = Array(5).fill().map((_, i) => 
                    i < Math.floor(rating) ? '<i class="fas fa-star"></i>' : 
                    i < rating ? '<i class="fas fa-star-half-alt"></i>' : 
                    '<i class="far fa-star"></i>'
                ).join('');
                
                // Create specifications list
                let specsHtml = '';
                if (product.specifications) {
                    specsHtml = Object.entries(product.specifications)
                        .map(([key, value]) => `<li><strong>${key.replace('_', ' ')}:</strong> ${value}</li>`)
                        .join('');
                }
                
                // Create variants list
                let variantsHtml = '';
                if (product.variants && product.variants.length > 0) {
                    variantsHtml = product.variants
                        .map(variant => `<li><strong>${variant.color}:</strong> ${variant.stock} in stock</li>`)
                        .join('');
                }
                
                quickViewContent.innerHTML = `
                    <div class="quick-view-content">
                        <div class="quick-view-image">
                            <img src="${product.images[0] || 'https://via.placeholder.com/500'}" alt="${product.name}">
                        </div>
                        <div class="quick-view-details">
                            <h2>${product.name}</h2>
                            <div class="quick-view-price">${formattedPrice}</div>
                            <div class="quick-view-rating">
                                <div class="stars">${stars}</div>
                                <span class="count">(${product.ratings?.count || 0} reviews)</span>
                            </div>
                            <p class="quick-view-description">${product.description}</p>
                            
                            ${specsHtml ? `
                            <div class="quick-view-specs">
                                <h4>Specifications</h4>
                                <ul>${specsHtml}</ul>
                            </div>
                            ` : ''}
                            
                            ${variantsHtml ? `
                            <div class="quick-view-specs">
                                <h4>Available Variants</h4>
                                <ul>${variantsHtml}</ul>
                            </div>
                            ` : ''}
                            
                            <div class="quick-view-actions">
                                <button class="btn btn-primary add-to-cart" data-id="${product.id}">
                                    <i class="fas fa-shopping-cart"></i> Add to Cart
                                </button>
                                
                            </div>
                        </div>
                    </div>
                `;
                
                // Add event listener to add to cart button in modal
                document.querySelector('.quick-view-actions .add-to-cart').addEventListener('click', () => {
                    addToCart(product.id);
                });
            } else {
                throw new Error(data.message || 'Failed to load product details');
            }
        } catch (error) {
            console.error('Error loading product details:', error);
            quickViewContent.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>Failed to load product details</h3>
                    <p>${error.message}</p>
                </div>
            `;
        }
    }

    async function addToCart(productId, quantity = 1) {
    // Check if user is authenticated
    const token = localStorage.getItem('auth_token');
    
    if (!token) {
        showNotification('Please login to add items to cart', false);
        return;
    }

    try {
        // Show loading state (optional)
        // You could add a loading spinner on the button here if needed

        // Make API call to add to cart
        const response = await fetch(`${API_BASE_URL}/cart/add`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                product_id: parseInt(productId),
                quantity: quantity
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || 'Failed to add to cart');
        }

        if (data.success) {
            // Show success notification
            showNotification(data.message || 'Product added to cart successfully', true);
            
            // Update cart count in the header
            updateCartCount();
        } else {
            throw new Error(data.message || 'Failed to add to cart');
        }
    } catch (error) {
        console.error('Error adding to cart:', error);
        showNotification(error.message || 'Failed to add to cart', false);
    }
}

function showNotification(message, isSuccess) {
    const notification = document.createElement('div');
    notification.className = `notification ${isSuccess ? '' : 'error'}`;
    notification.innerHTML = `
        <i class="fas ${isSuccess ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
        <p>${message}</p>
    `;
    document.body.appendChild(notification);
    
    // Remove notification after 3 seconds
    setTimeout(() => {
        notification.classList.add('fade-out');
        setTimeout(() => {
            notification.remove();
        }, 300);
    }, 3000);
}

async function updateCartCount() {
    const token = localStorage.getItem('auth_token');
    
    if (!token) {
        document.querySelector('.cart-count').textContent = '0';
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/cart/count`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (data.success) {
            document.querySelector('.cart-count').textContent = data.cart_items_count || '0';
        }
    } catch (error) {
        console.error('Error updating cart count:', error);
    }
}

// Add this CSS for error notifications
const style = document.createElement('style');
style.textContent = `
    .notification.error {
        background-color: var(--error-color);
    }
`;
document.head.appendChild(style);
</script>
